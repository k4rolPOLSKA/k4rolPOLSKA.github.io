<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restauracja Furcham - Zamówienie Online</title>
    <style>
        :root {
            --primary: #d9534f;
            --primary-hover: #c9302c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary);
            color: white;
            padding: 20px 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
        }

        header p {
            margin: 5px 0 0 0;
            font-size: 1.1em;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .category-title {
            background: #eee;
            padding: 10px 15px;
            border-radius: 5px;
            margin-top: 25px;
            font-size: 1.3em;
            color: #444;
            border-left: 5px solid var(--primary);
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .item-card {
            background: var(--card-bg);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .item-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .item-name {
            font-weight: bold;
            font-size: 1.05em;
            margin-bottom: 5px;
        }

        .item-price {
            color: var(--primary);
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: var(--primary-hover);
        }

        /* Koszyk */
        .cart-section {
            background: var(--card-bg);
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .cart-section h2 {
            margin-top: 0;
            border-bottom: 2px solid #f4f4f4;
            padding-bottom: 10px;
        }

        .cart-items {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.95em;
            border-bottom: 1px dashed #eee;
            padding-bottom: 5px;
        }

        .cart-item-controls button {
            background: #eee;
            border: none;
            padding: 2px 6px;
            cursor: pointer;
            border-radius: 3px;
            font-weight: bold;
        }

        .cart-total {
            font-size: 1.3em;
            font-weight: bold;
            text-align: right;
            margin-bottom: 15px;
        }

        .order-form label {
            display: block;
            margin-top: 10px;
            font-size: 0.9em;
            font-weight: bold;
        }

        .order-form input, .order-form textarea, .order-form select {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .btn-order {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }

        .btn-order:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<header>
    <h1>Restauracja Furcham</h1>
    <p>Smaczne, domowe posiłki na każde życzenie!</p>
</header>

<div class="container">
    <div id="menu">
        <!-- Menu jest generowane dynamicznie przez JavaScript -->
    </div>

    <div class="cart-section">
        <h2>Twoje Zamówienie 🛒</h2>
        <ul id="cart-items" class="cart-items">
            <li style="color: #777;">Koszyk jest pusty.</li>
        </ul>
        <div class="cart-total">
            Suma: <span id="cart-total-price">0.00</span> zł
        </div>

        <form id="order-form" class="order-form" onsubmit="submitOrder(event)">
            <label for="name">Imię i Nazwisko:</label>
            <input type="text" id="name" required placeholder="Jan Kowalski">

            <label for="phone">Numer telefonu:</label>
            <input type="tel" id="phone" required placeholder="123 456 789">

            <label for="address">Adres dostawy / Uwagi:</label>
            <textarea id="address" rows="3" required placeholder="ul. Prosta 12/4, Warszawa..."></textarea>

            <label for="payment">Forma płatności:</label>
            <select id="payment">
                <option value="Gotówka przy odbiorze">Gotówka przy odbiorze</option>
                <option value="Karta przy odbiorze">Karta przy odbiorze</option>
                <option value="BLIK przy odbiorze">BLIK przy odbiorze</option>
            </select>

            <button type="submit" class="btn-order">Złóż Zamówienie</button>
        </form>
    </div>
</div>

    let cart = [];

    function renderMenu() {
        const menuContainer = document.getElementById('menu');
        menuContainer.innerHTML = '';

        menuData.forEach(cat => {
            const catTitle = document.createElement('div');
            catTitle.className = 'category-title';
            catTitle.innerText = cat.category;
            menuContainer.appendChild(catTitle);

            const grid = document.createElement('div');
            grid.className = 'menu-grid';

            cat.items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'item-card';
                card.innerHTML = `
                    <div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price.toFixed(2)} zł</div>
                    </div>
                    <button class="btn-add" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})">Dodaj do koszyka</button>
                `;
                grid.appendChild(card);
            });

            menuContainer.appendChild(grid);
        });
    }

    function addToCart(name, price) {
        const existingItem = cart.find(item => item.name === name);
        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({ name, price, quantity: 1 });
        }
        updateCart();
    }

    function changeQuantity(name, delta) {
        const item = cart.find(item => item.name === name);
        if (item) {
            item.quantity += delta;
            if (item.quantity <= 0) {
                cart = cart.filter(i => i.name !== name);
            }
        }
        updateCart();
    }

    function updateCart() {
        const cartList = document.getElementById('cart-items');
        const totalPriceEl = document.getElementById('cart-total-price');

        cartList.innerHTML = '';

        if (cart.length === 0) {
            cartList.innerHTML = '<li style="color: #777;">Koszyk jest pusty.</li>';
            totalPriceEl.innerText = '0.00';
            return;
        }

        let total = 0;

        cart.forEach(item => {
            const itemTotal = item.price * item.quantity;
            total += itemTotal;

            const li = document.createElement('li');
            li.className = 'cart-item';
            li.innerHTML = `
                <div>
                    <strong>${item.name}</strong><br>
                    ${item.price.toFixed(2)} zł x ${item.quantity} = ${itemTotal.toFixed(2)} zł
                </div>
                <div class="cart-item-controls">
                    <button onclick="changeQuantity('${item.name.replace(/'/g, "\\'")}', -1)">-</button>
                    <button onclick="changeQuantity('${item.name.replace(/'/g, "\\'")}', 1)">+</button>
                </div>
            `;
            cartList.appendChild(li);
        });

        totalPriceEl.innerText = total.toFixed(2);
    }

    function submitOrder(event) {
        event.preventDefault();

        if (cart.length === 0) {
            alert('Twój koszyk jest pusty!');
            return;
        }

        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const address = document.getElementById('address').value;
        const payment = document.getElementById('payment').value;

        let summary = `Dziękujemy za zamówienie, ${name}!\n\n`;
        summary += `Zamówione dania:\n`;
        let total = 0;
        cart.forEach(item => {
            const sum = item.price * item.quantity;
            total += sum;
            summary += `- ${item.name} x${item.quantity} (${sum.toFixed(2)} zł)\n`;
        });
        summary += `\nŁączna kwota: ${total.toFixed(2)} zł\n`;
        summary += `Płatność: ${payment}\n`;
        summary += `Adres dostawy: ${address}\n`;
        summary += `Telefon kontaktowy: ${phone}\n\n`;
        summary += `Zamówienie zostało przekazane do Restauracji Furcham!`;

        alert(summary);

        // Czyszczenie koszyka
        cart = [];
        updateCart();
        document.getElementById('order-form').reset();
    }

    // Inicjalizacja menu przy załadowaniu strony
    renderMenu();
</script>

</html>
