<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALLOWEEN × GhostHUB 1.3</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #35115f 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #5a2500 0%, transparent 30%),
        #050509;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.container {
    width: min(1000px, 100%);
    text-align: center;
}

.version {
    display: inline-block;
    padding: 7px 14px;
    border: 1px solid #7137a8;
    border-radius: 30px;
    color: #cda5ff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

h1 {
    font-size: clamp(40px, 9vw, 78px);
    letter-spacing: -3px;
    margin-bottom: 10px;
}

h1 span {
    color: #ff7615;
}

.subtitle {
    color: #999;
    margin-bottom: 35px;
}

.events {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
}

.card {
    padding: 32px 25px;
    border-radius: 24px;
    background: rgba(13, 13, 21, .9);
    border: 1px solid #292936;
}

.ghost {
    border-color: #783bb0;
}

.halloween {
    border-color: #a34e0b;
}

.icon {
    font-size: 50px;
}

h2 {
    margin-top: 12px;
    font-size: 29px;
}

.ghost h2 {
    color: #c18aff;
}

.halloween h2 {
    color: #ff9345;
}

.date {
    color: #777;
    font-size: 13px;
    margin-top: 7px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-top: 28px;
}

.time {
    background: #09090e;
    border: 1px solid #24242f;
    border-radius: 13px;
    padding: 13px 4px;
}

.number {
    font-size: 27px;
    font-weight: bold;
}

.label {
    color: #666;
    font-size: 9px;
    margin-top: 5px;
}

.ghost-button {
    display: inline-block;
    margin-top: 25px;
    padding: 13px 22px;
    border-radius: 12px;
    background: #7b3fc0;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: .25s;
}

.ghost-button:hover {
    background: #9652df;
    transform: translateY(-2px);
}

.status {
    margin-top: 18px;
    color: #777;
    font-size: 13px;
}

footer {
    margin-top: 28px;
    color: #555;
    font-size: 12px;
}

@media (max-width: 700px) {
    .events {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 28px 20px;
    }

    .countdown {
        gap: 5px;
    }

    .number {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="version">
        VERSION 1.3 • 2026
    </div>

    <h1>
        HALLOWEEN <span>×</span> GhostHUB
    </h1>

    <p class="subtitle">
        Nadchodzą dwa wydarzenia 👻🎃
    </p>

    <section class="events">

        <!-- GHOSTHUB -->

        <div class="card ghost">

            <div class="icon">👻</div>

            <h2>GhostHUB</h2>

            <div class="date">
                START • 15 PAŹDZIERNIKA 2026
            </div>

            <div
                class="countdown"
                id="ghostCountdown">
            </div>

            <a
                class="ghost-button"
                href="https://k4rolpolska.github.io/GhostHub">
                👻 PRZEJDŹ DO GHOSTHUB
            </a>

            <div
                class="status"
                id="ghostStatus">
                Odliczanie do startu...
            </div>

        </div>


        <!-- HALLOWEEN -->

        <div class="card halloween">

            <div class="icon">🎃</div>

            <h2>HALLOWEEN 2026</h2>

            <div class="date">
                START • 30 PAŹDZIERNIKA 2026
            </div>

            <div
                class="countdown"
                id="halloweenCountdown">
            </div>

            <div
                class="status"
                id="halloweenStatus">
                Odliczanie do startu...
            </div>

        </div>

    </section>

    <footer>
        HALLOWEEN × GhostHUB • 1.3
    </footer>

</div>


<script>

const ghostDate =
    new Date("2026-10-01T00:00:00");

const halloweenDate =
    new Date("2026-10-30T00:00:00");


function updateCountdown(date, elementId, statusId, name) {

    const element =
        document.getElementById(elementId);

    const status =
        document.getElementById(statusId);

    const difference =
        date.getTime() - Date.now();

    if (difference <= 0) {

        element.innerHTML = `
            <div
                class="time"
                style="grid-column: 1 / -1;">
                <div class="number">START!</div>
                <div class="label">${name}</div>
            </div>
        `;

        status.textContent =
            "🚀 Wydarzenie już się rozpoczęło!";

        return;
    }

    const days =
        Math.floor(difference / 86400000);

    const hours =
        Math.floor(difference / 3600000) % 24;

    const minutes =
        Math.floor(difference / 60000) % 60;

    const seconds =
        Math.floor(difference / 1000) % 60;

    element.innerHTML = `
        <div class="time">
            <div class="number">${days}</div>
            <div class="label">DNI</div>
        </div>

        <div class="time">
            <div class="number">
                ${String(hours).padStart(2, "0")}
            </div>
            <div class="label">GODZ</div>
        </div>

        <div class="time">
            <div class="number">
                ${String(minutes).padStart(2, "0")}
            </div>
            <div class="label">MIN</div>
        </div>

        <div class="time">
            <div class="number">
                ${String(seconds).padStart(2, "0")}
            </div>
            <div class="label">SEK</div>
        </div>
    `;
}


function update() {

    updateCountdown(
        ghostDate,
        "ghostCountdown",
        "ghostStatus",
        "GhostHUB"
    );

    updateCountdown(
        halloweenDate,
        "halloweenCountdown",
        "halloweenStatus",
        "HALLOWEEN 2026"
    );
}

update();

setInterval(update, 1000);

</script>

</body>
</html>
